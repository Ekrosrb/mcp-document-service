server:
  port: 55535

spring:
  application:
    name: mcp-document-service
  datasource:
    url: jdbc:postgresql://localhost:5445/document-db
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  ai:
    mcp:
      server:
        name: mcp-document-service
        version: 1.0.0
        instructions: >-
          Shared store of documents (reference material, usually written by people) and memories
          (short notes written by agents). Before a task call searchMemories, and searchDocuments
          when you need reference material; filter by projectKey when you work in a project.
          Search returns ids, names and metadata only; call getDocument for the full text.
          When you learn something that will stay true after this conversation, save it with
          createMemory. When an entry replaces an older one, link them with createDocumentRelation
          and type SUPERSEDES; search then leaves the older one out. You can update or remove only entries whose allowWrite is true.
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml