plugins {
    id 'java'
}

group = 'com.ekros.hl.doc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

dependencies {
    testImplementation platform(libs.spring.boot.dependencies)
    testImplementation platform(libs.spring.ai.bom)
    testImplementation platform(libs.jackson.bom)
    testImplementation platform(libs.cucumber.bom)

    testImplementation project(':')
    testImplementation libs.spring.boot.core
    testImplementation libs.jackson.databind
    testImplementation libs.spring.ai.mcp
    testImplementation libs.jtoon

    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.picocontainer
    testImplementation libs.cucumber.junit.platform.engine
    testImplementation libs.junit.platform.suite
    testImplementation libs.json.unit.assertj
    testImplementation libs.assertj.core

    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.postgresql
}

def compose = ['docker', 'compose', '-p', 'mcp-document-service-it', '-f', file('docker/docker-compose.yaml').path]

tasks.register('composeUp', Exec) {
    group = 'verification'
    description = 'Starts the IT infrastructure.'
    commandLine compose + ['up', '-d', '--wait']
}

tasks.register('composeDown', Exec) {
    group = 'verification'
    description = 'Stops the IT infrastructure and drops its data.'
    commandLine compose + ['down', '-v']
}

def externalInfrastructure = providers.gradleProperty('externalInfrastructure').isPresent()

test {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
    if (!externalInfrastructure) {
        dependsOn composeUp
        finalizedBy composeDown
    }
    outputs.upToDateWhen { false }
    timeout = java.time.Duration.ofMinutes(5)
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
