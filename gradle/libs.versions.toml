[versions]
java = "26"
spring-boot = "4.1.2"
spring-ai = "2.0.0"
jackson = "3.2.4"
logback = "1.6.6"
slf4j = "2.0.20"
lombok = "1.18.48"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
jtoon = "3.0.0"
springdoc = "3.2.0"
cucumber = "8.0.4"
json-unit = "6.4.0"

[libraries]
# BOMs
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
cucumber-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber" }

# Versions managed by the BOMs
spring-boot-core = { module = "org.springframework.boot:spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-ai-starter-mcp-server-webmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
spring-ai-mcp = { module = "org.springframework.ai:spring-ai-mcp" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
liquibase-core = { module = "org.liquibase:liquibase-core" }
postgresql = { module = "org.postgresql:postgresql" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
cucumber-java = { module = "io.cucumber:cucumber-java" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine" }

# Libraries with their own versions
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
jtoon = { module = "dev.toonformat:jtoon", version.ref = "jtoon" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
json-unit-assertj = { module = "net.javacrumbs.json-unit:json-unit-assertj", version.ref = "json-unit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
