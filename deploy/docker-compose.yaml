services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres-document-service
    restart: unless-stopped

    environment:
      POSTGRES_DB: document-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5445:5432"

    volumes:
      - ./document/postgres:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d document-db" ]
      interval: 5s
      timeout: 5s
      retries: 10