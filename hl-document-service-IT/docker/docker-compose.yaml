services:
  postgres:
    image: pgvector/pgvector:pg18

    environment:
      POSTGRES_DB: document-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "43556:5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d document-db" ]
      interval: 2s
      timeout: 5s
      retries: 30
